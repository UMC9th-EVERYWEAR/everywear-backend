spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/everywear?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      # 풀의 최대 커넥션 개수 (기본값: 10)
      maximum-pool-size: 20
      # 커넥션 획득 대기 시간 (기본값: 30초)
      connection-timeout: 30000
      # 커넥션의 최대 생명 주기 (DB wait_timeout보다 짧게 설정)
      max-lifetime: 1800000
      # 유휴 커넥션 유지 시간
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.web.client: DEBUG

cloud:
  aws:
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${S3_BUCKET}
    credentials:
      instance-profile: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000  # 1시간
  refresh-token-expiration: 1209600000  # 14일

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}

fastapi:
  base-url: ${FASTAPI_BASE_URL}

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  base-url: https://api.openai.com/v1
  max-tokens: 500

gemini:
  api:
    key: ${GEMINI_API_KEY}